app:
  name: "crypto_attack_detection"
  version: "1.0.0"
  description: "密码风险检测、加密存储与联邦训练演示平台"

# The active web runtime is app.py. It serves the same Flask application on
# ports 5000 (user) and 5001 (admin) and stores durable state in SQLite/files.
runtime:
  entrypoint: "app.py"
  user_port: 5000
  admin_port: 5001
  storage: "sqlite_and_files"
  database_path: "data/system.db"
  federated_mode: "four_local_simulated_nodes"

encryption:
  paillier:
    key_size: 2048
    precision: 64
    threshold: 0.001

detection:
  feature_dim: 18
  preprocessing_version: "security-fixed-ranges-v1"
  isolation_forest:
    n_estimators: 100
    contamination: 0.1
  lstm:
    hidden_units: 128
    layers: 2
    dropout: 0.3
    batch_size: 64
    epochs: 50

optimization:
  q_learning:
    alpha: 0.1
    gamma: 0.99
    epsilon: 0.1
    episodes: 1000
  action_space:
    key_lengths: [1024, 2048, 4096]
    rounds: [1, 2, 3]
  state_space:
    risk_levels: ["low", "medium", "high", "critical"]

# Optional research integration used only by `python -m src.main --mode federated`.
# It is not part of the active web application's four-node simulation.
fate:
  enabled: false
  host: "localhost"
  port: 9380
  version: "1.11.0"
